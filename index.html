<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青空風紀委員</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-blue-600">👮‍♂️ 青空風紀委員</h1>
        <p class="text-sm text-gray-600 mb-4">Blueskyのハンドルを入力して、直近の投稿の健全性を調査します。</p>
        
        <input id="handle" type="text" placeholder="arai.bsky.social" class="border p-2 w-full mb-4 rounded focus:outline-blue-400">
        <button onclick="checkMorals()" id="btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded w-full font-bold transition-all">
            風紀検査を開始する
        </button>

        <div id="result" class="mt-8 hidden">
            <div class="p-4 bg-red-50 rounded-lg mb-6 border border-red-100">
                <h2 class="text-xl font-semibold text-gray-800">風紀乱れ度: <span id="level" class="text-red-600 text-3xl font-black"></span></h2>
            </div>
            
            <div class="mt-4">
                <h3 class="font-bold mb-2 text-gray-700">📜 解析レポート（いいね順）</h3>
                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50"><tr class="border-b"><th class="p-3">内容</th><th class="p-3 w-20">いいね</th><th class="p-3 w-24">判定</th></tr></thead>
                        <tbody id="post-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function checkMorals() {
            const rawHandle = document.getElementById('handle').value.trim();
            if (!rawHandle) return alert("ハンドル名を入力してください");
            
            // @を除去
            const handle = rawHandle.replace(/^@/, '');

            const btn = document.getElementById('btn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerText = "🚨 検査中...（AIが解析しています）";
            resultDiv.classList.add('hidden');

            try {
                const response = await fetch(`https://nyanpre-discipline-committee.hf.space/analyze?handle=${handle}`);
                
                // サーバーが200以外を返した場合は、まず中身をパースしてエラー詳細を取得
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({detail: "不明なサーバーエラー"}));
                    throw new Error(errorData.detail || `HTTPエラー: ${response.status}`);
                }
                
                const data = await response.json();

                // 結果の反映
                document.getElementById('level').innerText = data.disorder_level + "%";
                const table = document.getElementById('post-table');
                table.innerHTML = "";

                if (!data.posts || data.posts.length === 0) {
                    table.innerHTML = "<tr><td colspan='3' class='p-4 text-center text-gray-500 text-sm'>対象の投稿が見つかりませんでした</td></tr>";
                } else {
                    data.posts.forEach(p => {
                        const row = `
                            <tr class="border-b hover:bg-gray-50 transition-colors">
                                <td class="p-3 break-all leading-relaxed">${p.text}</td>
                                <td class="p-3 font-mono text-center">${p.likes}</td>
                                <td class="p-3 text-center">
                                    <span class="px-2 py-1 rounded-full text-xs font-bold ${p.judgment === 'OUT' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
                                        ${p.judgment === 'OUT' ? '🚨 OUT' : '✅ SAFE'}
                                    </span>
                                </td>
                            </tr>`;
                        table.insertAdjacentHTML('beforeend', row);
                    });
                }

                resultDiv.classList.remove('hidden');
            } catch (error) {
                console.error("DEBUG:", error);
                // ここで詳細なエラーを表示
                alert(`👮‍♂️ 風紀委員エラー報告:\n\n${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerText = "風紀検査を開始する";
            }
        }
    </script>
</body>
</html>
