<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青空風紀委員</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4">👮‍♂️ 青空風紀委員</h1>
        <p class="text-sm text-gray-600 mb-4">Blueskyのハンドルを入力して、直近の投稿の健全性を調査します。</p>
        
        <input id="handle" type="text" placeholder="arai.bsky.social" class="border p-2 w-full mb-4 rounded">
        <button onclick="checkMorals()" id="btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded w-full transition-colors">
            風紀検査を開始する
        </button>

        <div id="result" class="mt-8 hidden">
            <div class="p-4 bg-red-50 rounded-lg mb-6">
                <h2 class="text-xl font-semibold text-gray-800">風紀乱れ度: <span id="level" class="text-red-600 text-2xl"></span></h2>
            </div>
            
            <div class="mt-4">
                <h3 class="font-bold mb-2">投稿詳細（いいね順）</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100"><tr class="border-b"><th class="p-2">内容</th><th class="p-2">いいね</th><th class="p-2">判定</th></tr></thead>
                        <tbody id="post-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function checkMorals() {
            const handle = document.getElementById('handle').value.trim();
            if (!handle) return alert("ハンドル名を入力してください");

            const btn = document.getElementById('btn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerText = "検査中...（約10〜20秒かかります）";
            resultDiv.classList.add('hidden');

            try {
                // APIの呼び出し
                const response = await fetch(`https://nyanpre-discipline-committee.hf.space/analyze?handle=${handle}`);
                
                if (!response.ok) throw new Error("サーバー側でエラーが発生しました");
                
                const data = await response.json();

                // 結果の表示
                document.getElementById('level').innerText = data.disorder_level + "%";
                const table = document.getElementById('post-table');
                table.innerHTML = "";

                if (data.posts.length === 0) {
                    table.innerHTML = "<tr><td colspan='3' class='p-4 text-center'>投稿が見つかりませんでした</td></tr>";
                } else {
                    data.posts.forEach(p => {
                        const row = `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="p-2 truncate max-w-xs">${p.text}</td>
                                <td class="p-2">${p.likes}</td>
                                <td class="p-2">${p.judgment === 'OUT' ? '🚨 乱れている' : '✅ 健全'}</td>
                            </tr>`;
                        table.insertAdjacentHTML('beforeend', row);
                    });
                }

                resultDiv.classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert("エラーが発生しました。Hugging FaceのSpaceが「Running」になっているか確認してください。");
            } finally {
                btn.disabled = false;
                btn.innerText = "風紀検査を開始する";
            }
        }
    </script>
</body>
</html>
