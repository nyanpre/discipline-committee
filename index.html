<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>青空風紀委員</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4">👮‍♂️ 青空風紀委員</h1>
        <input id="handle" type="text" placeholder="arai.bsky.social" class="border p-2 w-full mb-4 rounded">
        <button onclick="checkMorals()" id="btn" class="bg-blue-500 text-white px-4 py-2 rounded w-full">風紀検査</button>

        <div id="result" class="mt-8 hidden">
            <h2 class="text-xl font-semibold">風紀乱れ度: <span id="level" class="text-red-500"></span></h2>
            <div class="mt-4">
                <table class="w-full text-sm">
                    <thead><tr class="border-b"><th>投稿内容</th><th>いいね</th><th>判定</th></tr></thead>
                    <tbody id="post-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function checkMorals() {
            const handle = document.getElementById('handle').value;
            const handle = document.getElementById('handle').value;
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = "検査中...";

            // Hugging FaceのSpaceの直URLを指定
            const response = await fetch(`https://nyanpre-discipline-committee.hf.space/analyze?handle=${handle}`);
            const data = await response.json();

            document.getElementById('level').innerText = data.disorder_level + "%";
            const table = document.getElementById('post-table');
            table.innerHTML = "";

            data.posts.forEach(p => {
                const row = `
                    <tr class="border-b">
                        <td class="p-2">${p.text.substring(0,30)}...</td>
                        <td class="p-2">${p.likes}</td>
                        <td class="p-2">${p.judgment === 'OUT' ? '🚨' : '✅'}</td>
                    </tr>`;
                table.insertAdjacentHTML('beforeend', row);
            });

            document.getElementById('result').classList.remove('hidden');
            btn.disabled = false;
            btn.innerText = "風紀検査";
        }
    </script>
</body>
</html>
