<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青空風紀委員</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* スマホ向けのフォントサイズ微調整とテーブル折り返し設定 */
        @media (max-width: 640px) {
            .post-text { font-size: 0.85rem; line-height: 1.4; }
            .table-header { font-size: 0.8rem; }
            .cell-padding { padding: 0.5rem 0.25rem !important; }
        }
    </style>
</head>
<body class="bg-slate-50 p-4 sm:p-8 text-gray-800">
    <div class="max-w-3xl mx-auto bg-white p-5 sm:p-6 rounded-xl shadow-sm">
        <h1 class="text-xl sm:text-2xl font-bold mb-2 text-blue-600">青空風紀委員</h1>
        <p class="text-xs sm:text-sm text-gray-600 mb-5">AIモデルが風紀の乱れを判定します。</p>
        
        <div class="flex flex-col gap-3 mb-6">
            <input id="handle" type="text" placeholder="arai.bsky.social" class="border p-2.5 w-full text-sm rounded focus:outline-blue-400">
            <button onclick="checkMorals()" id="btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2.5 rounded w-full text-sm font-bold transition-all">
                風紀検査を開始する
            </button>
        </div>

        <div id="result" class="mt-6 hidden">
            <div class="p-4 bg-red-50 rounded-lg mb-6 border border-red-100 text-center">
                <h2 class="text-lg sm:text-xl font-semibold text-gray-700">風紀乱れ度 <span id="level" class="text-red-600 text-2xl sm:text-3xl font-black ml-1"></span></h2>
            </div>
            
            <div class="mt-4">
                <h3 class="text-sm sm:text-base font-bold mb-2 text-gray-700">解析レポート（いいね順）</h3>
                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table class="w-full text-left border-collapse min-w-[300px]">
                        <thead class="bg-gray-50 table-header">
                            <tr class="border-b text-gray-600 font-medium">
                                <th class="p-2 sm:p-3 cell-padding">投稿内容</th>
                                <th class="p-2 w-12 text-center cell-padding">いいね</th>
                                <th class="p-2 w-16 text-center cell-padding">確信度</th>
                                <th class="p-2 w-16 text-center cell-padding">判定</th>
                            </tr>
                        </thead>
                        <tbody id="post-table" class="text-xs sm:text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function checkMorals() {
            const rawHandle = document.getElementById('handle').value.trim();
            if (!rawHandle) return alert("ハンドル名を入力してください");
            
            const handle = rawHandle.replace(/^@/, '');
            const btn = document.getElementById('btn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerText = "検査中...";
            resultDiv.classList.add('hidden');

            try {
                const response = await fetch(`https://nyanpre-discipline-committee.hf.space/analyze?handle=${handle}`);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({detail: "不明なサーバーエラー"}));
                    throw new Error(errorData.detail || `HTTPエラー: ${response.status}`);
                }
                
                const data = await response.json();

                document.getElementById('level').innerText = data.disorder_level + "%";
                const table = document.getElementById('post-table');
                table.innerHTML = "";

                if (!data.posts || data.posts.length === 0) {
                    table.innerHTML = "<tr><td colspan='4' class='p-4 text-center text-gray-500 text-xs sm:text-sm'>対象の投稿が見つかりませんでした</td></tr>";
                } else {
                    data.posts.forEach(p => {
                        const scoreColor = p.raw_score >= 57.8 ? 'text-red-600 font-bold' : 'text-gray-500';
                        
                        // 判定ラベルのデザイン（絵文字なし・スマホ向けにパディングを少し小さく）
                        const judgmentBadge = p.judgment === 'OUT'
                            ? `<span class="bg-red-100 text-red-700 px-1.5 py-0.5 rounded text-[10px] sm:text-xs font-bold">OUT</span>`
                            : `<span class="bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded text-[10px] sm:text-xs">SAFE</span>`;

                        const row = `
                            <tr class="border-b hover:bg-gray-50 transition-colors">
                                <td class="p-2 sm:p-3 cell-padding break-all post-text">${p.text}</td>
                                <td class="p-2 text-center cell-padding font-mono text-gray-600">${p.likes}</td>
                                <td class="p-2 text-center cell-padding font-mono ${scoreColor}">${p.raw_score}%</td>
                                <td class="p-2 text-center cell-padding">${judgmentBadge}</td>
                            </tr>`;
                        table.insertAdjacentHTML('beforeend', row);
                    });
                }

                resultDiv.classList.remove('hidden');
            } catch (error) {
                console.error("DEBUG:", error);
                alert(`風紀委員エラー報告:\n\n${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerText = "風紀検査を開始する";
            }
        }
    </script>
</body>
</html>
